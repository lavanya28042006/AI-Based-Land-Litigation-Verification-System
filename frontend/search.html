<!DOCTYPE html>
<html>
<head>
    <title>Land Litigation Verification System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <script>
        if (localStorage.getItem("loggedIn") !== "true") {
              window.location.href = "login.html";
    }
    </script>

    <header>
        <h1>
            Land Litigation Verification System<br>
            நில வழக்கு சரிபார்ப்பு அமைப்பு
        </h1>
    </header>
    <nav>
      <a href="index.html">Home / முகப்பு</a>
      <a href="search.html">Search / தேடல்</a>
      <a href="admin.html">Admin / நிர்வாகம்</a>
      <a href="search-history.html">
    Search History / தேடல் வரலாறு
</a>
    </nav>
    <div class="container">
        <h2>
            Search Land Details / நில விவரங்களை தேடவும்
        </h2>

        <label>
            District / மாவட்டம்
        </label>
        <input type="text" id="district" placeholder="Enter District">
        <label>
            Taluk / வட்டம்
        </label>
<input
    type="text"
    id="taluk"
    placeholder="Enter Taluk"
>

        <label>
            Village / கிராமம்
        </label>
        <input type="text" id="village" placeholder="Enter Village">

        <label>
            Survey Number / சர்வே எண்
        </label>
        <input type="text" id="survey" placeholder="Enter Survey Number">   

        <button onclick="searchLand()">
            Search / தேடு
        </button>

        <div id="result"></div>
    </div>
    
    <button onclick="window.print()" id="printBtn">
        Print Report / அறிக்கை அச்சிடு
    </button>
    <button onclick="downloadVerificationPDF()" id="downloadPdfBtn">
    Download PDF / PDF பதிவிறக்கம்
</button>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="js/app.js"></script>


</body>
</html>
